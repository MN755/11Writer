name: Privacy leak guard

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  privacy:
    name: Check newly introduced privacy exposures
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout full commit range without credentials
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Inspect new commits and added lines; redact findings
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          import subprocess
          import sys

          personal_domains = {
              "gmail.com", "googlemail.com", "outlook.com", "hotmail.com",
              "live.com", "yahoo.com", "icloud.com", "me.com", "mac.com",
              "protonmail.com", "proton.me", "aol.com"
          }
          placeholders = {
              "redacted_user", "redacted", "user", "username", "you",
              "test", "tester", "example", "public", "shared", "runner",
              "sample", "placeholder", "currentuser"
          }
          owner = (os.environ.get("REPO_OWNER") or "").strip().lower()
          if not re.fullmatch(r"[a-z0-9-]{1,39}", owner):
              raise SystemExit("Privacy check: repository owner unavailable.")

          email_pattern = re.compile(r"[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}")
          home_segment = "Us" + "ers"
          home_pattern = re.compile(
              r"(?:[A-Za-z]:[/\\]+" + home_segment + r"[/\\]+|/" +
              home_segment + r"/)([^/\\\s]+)", re.I
          )
          auth_pattern = re.compile(re.escape("--basic-auth" + "-username") + r"\s+([^\s]+)", re.I)

          def is_personal_mail(address):
              return address.strip().lower().rsplit("@", 1)[-1] in personal_domains

          def owner_noreply(address):
              local, sep, domain = address.strip().lower().partition("@")
              if not sep or domain != "users.noreply.github.com":
                  return False
              return local == owner or local.endswith("+" + owner) and local.split("+", 1)[0].isdigit()

          def identity_problem(name, address):
              if is_personal_mail(address):
                  return "personal-mailbox address in new commit metadata"
              if owner_noreply(address) and name.strip().lower() != owner:
                  return "owner noreply commit has a non-pseudonymous display name"
              return None

          def added_line_problems(line):
              issues = set()
              for address in email_pattern.findall(line):
                  if is_personal_mail(address):
                      issues.add("personal-mailbox address introduced in file content")
              for match in home_pattern.finditer(line):
                  local_user = match.group(1).strip("[]{}$<>()" + chr(34) + chr(39) + chr(96)).lower()
                  if local_user not in placeholders:
                      issues.add("unmasked computer home directory introduced")
              match = auth_pattern.search(line)
              if match:
                  value = match.group(1).strip(chr(34) + chr(39) + chr(96))
                  if not value.startswith(("$", "<", "{", "[", "%")):
                      issues.add("hardcoded Basic Auth username introduced")
              return issues

          # Non-sensitive regression samples. No user identifier is stored in this workflow.
          assert identity_problem("MN755", "123+MN755@users.noreply.github.com") is None
          assert identity_problem("Example Author", "123+MN755@users.noreply.github.com")
          assert identity_problem("Someone", "example@" + "gmail.com")
          assert not added_line_problems("Use C:/Users/REDACTED_USER/project")
          assert added_line_problems("Use C:/Users/specific-person/project")
          assert added_line_problems("Mail: example@" + "icloud.com")
          assert not added_line_problems("Pass --basic-auth" + "-username $env:USERNAME")
          assert added_line_problems("Pass --basic-auth" + "-username a-literal-user")

          def git(*args):
              result = subprocess.run(
                  ["git", *args], capture_output=True, text=True,
                  encoding="utf-8", errors="replace"
              )
              if result.returncode:
                  raise RuntimeError("Required Git revision data unavailable.")
              return result.stdout.strip()

          base = (os.environ.get("BASE_SHA") or "").strip()
          head = (os.environ.get("HEAD_SHA") or "").strip()
          if not re.fullmatch(r"[0-9a-fA-F]{40,64}", head):
              raise SystemExit("Privacy check: invalid target commit.")
          try:
              git("cat-file", "-e", head + "^{commit}")
              if not base or set(base) == {"0"}:
                  # For a genuinely new root, compare against Git's empty tree.
                  empty = subprocess.run(
                      ["git", "hash-object", "-w", "-t", "tree", "--stdin"],
                      input="", text=True, capture_output=True, check=True
                  ).stdout.strip()
                  diff = git("diff", "--no-ext-diff", "--no-textconv", "--unified=0", empty, head)
                  commits = git("log", "--format=%an%x1f%ae%x1f%cn%x1f%ce", head)
              else:
                  if not re.fullmatch(r"[0-9a-fA-F]{40,64}", base):
                      raise RuntimeError("Invalid base SHA.")
                  git("cat-file", "-e", base + "^{commit}")
                  diff = git("diff", "--no-ext-diff", "--no-textconv", "--unified=0", base, head)
                  commits = git("log", "--format=%an%x1f%ae%x1f%cn%x1f%ce", base + ".." + head)
          except (RuntimeError, subprocess.CalledProcessError):
              raise SystemExit("Privacy check: unable to compare full change range.")

          findings = set()
          for record in commits.splitlines():
              fields = record.split("\x1f")
              if len(fields) != 4:
                  continue
              for name, address in ((fields[0], fields[1]), (fields[2], fields[3])):
                  issue = identity_problem(name, address)
                  if issue:
                      findings.add(issue)

          for line in diff.splitlines():
              if line.startswith("+") and not line.startswith("+++"):
                  findings.update(added_line_problems(line[1:]))

          if findings:
              print("Privacy check failed. Sensitive match values are intentionally not shown.")
              for issue in sorted(findings):
                  print("Finding category: " + issue)
              sys.exit(1)

          print("Privacy check passed: no monitored exposure introduced in changed material.")
          print("This is a limited preventative check, not comprehensive secret scanning.")
          PY
