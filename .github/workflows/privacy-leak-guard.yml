name: Privacy leak guard

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  privacy:
    name: Check new commits and additions for privacy leaks
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout change history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan newly introduced identifiers without echoing their values
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import os
          import re
          import subprocess
          import sys

          def git(*args):
              return subprocess.run(
                  ["git", *args], text=True, encoding="utf-8",
                  errors="replace", capture_output=True, check=True
              ).stdout

          base = (os.environ.get("BASE_SHA") or "").strip()
          head = (os.environ.get("HEAD_SHA") or "").strip()
          if not re.fullmatch(r"[0-9a-fA-F]{40}", head):
              raise SystemExit("Privacy guard: unable to resolve commit SHA.")
          if not base or base == "0" * 40:
              base = git("hash-object", "-t", "tree", "--stdin").strip()
          elif not re.fullmatch(r"[0-9a-fA-F]{40}", base):
              raise SystemExit("Privacy guard: invalid base SHA.")
          if subprocess.run(["git", "cat-file", "-e", head+"^{commit}"], capture_output=True).returncode:
              raise SystemExit("Privacy guard: head commit object unavailable.")
          try:
              diff = git("diff", "--no-ext-diff", "--no-textconv", "--unified=0", base, head, "--")
              commits = git("log", "--no-merges", "--format=%an%x1f%ae", base+".."+head).splitlines()
          except subprocess.CalledProcessError:
              raise SystemExit("Privacy guard: unable to compare Git revisions.")

          owner_email_hash = "b2257d1578df68ddf362712ced958ae43088694f345bdd5686a275c8228d2ade"
          owner_old_name_hash = "88d7941c734351b293b3e92415123d9262ded63b62820af569a206c79cc90516"
          mail = re.compile(r"[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}")
          segment = "Us" + "ers"
          home = re.compile(
              r"(?:[A-Za-z]:[/\\]+" + segment + r"[/\\]+|/" + segment + r"/)([^/\\\s]+)", re.I
          )
          auth = re.compile(re.escape("--basic-auth" + "-username") + r"\s+([^\s]+)", re.I)
          placeholders = {
              "redacted_user", "redacted", "user", "username", "you",
              "test", "tester", "example", "public", "shared", "runner",
              "sample", "placeholder"
          }
          problems = set()

          for line in commits:
              if "\x1f" not in line:
                  continue
              name, address = line.split("\x1f", 1)
              if hashlib.sha256(address.strip().lower().encode()).hexdigest() == owner_email_hash:
                  problems.add("new commit attributed to previously exposed personal email")
              if hashlib.sha256(name.strip().encode()).hexdigest() == owner_old_name_hash:
                  problems.add("new commit attributed to identifying author name")

          for line in diff.splitlines():
              if not line.startswith("+") or line.startswith("+++"):
                  continue
              added = line[1:]
              for match in mail.finditer(added):
                  if hashlib.sha256(match.group().lower().encode()).hexdigest() == owner_email_hash:
                      problems.add("previously exposed personal email added to files")
              for match in home.finditer(added):
                  directory = match.group(1).strip("[]{}$<>()" + chr(34) + chr(39) + chr(96)).lower()
                  if directory not in placeholders:
                      problems.add("non-generic local computer home path added")
              m = auth.search(added)
              if m and not m.group(1).startswith(("$", "<", "{", "[", "%")):
                  problems.add("hardcoded Basic Auth username added")

          if problems:
              print("Privacy guard FAILED; sensitive match values are not printed.")
              for category in sorted(problems):
                  print("Finding category: " + category)
              sys.exit(1)

          print("Privacy guard passed for new changes.")
          print("This is a limited metadata and PII check, not full secret scanning.")
          PY
